[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "archmind"
version = "0.1.0"
description = "AI-Powered System Design Simulator"
requires-python = ">=3.11"

dependencies = [
    # API layer
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Data validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0", 

    # Graph engine
    "networkx>=3.3",

    # AI layer 
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",            
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",               
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"
    
[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"